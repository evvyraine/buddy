appId: com.buddy.recorder
productName: Buddy
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/transcribe.py
  - resources/*.png
  - package.json
extraResources:
  - from: resources/transcribe.py
    to: transcribe.py
mac:
  category: public.app-category.productivity
  target:
    - dmg
  icon: resources/icon.png
  entitlementsInherit: entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Buddy records audio from your microphone when you hold the push-to-talk key.
    NSAppleEventsUsageDescription: Buddy uses AppleScript to paste transcriptions into the app you are using.
win:
  target:
    - nsis
  icon: resources/icon.png
linux:
  target:
    - AppImage
  category: Utility
  icon: resources/icon.png
